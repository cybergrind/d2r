# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
#
# Install once per clone: uv run pre-commit install
# Ruff and pyrefly run from the uv environment so hook and CLI versions match uv.lock.

exclude: ".git|.venv"
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: detect-private-key
      - id: fix-byte-order-marker
      - id: debug-statements
      - id: check-ast
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-xml
      - id: check-symlinks
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-docstring-first
      - id: check-executables-have-shebangs

  - repo: local
    hooks:
      # pricing/tools are standalone scripts not yet brought under the ruff config
      # (hundreds of findings); clean them up in their own pass before removing the exclude.
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix --preview --force-exclude
        language: system
        types_or: [python, pyi]
        exclude: ^pricing/tools/
        require_serial: true
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --force-exclude
        language: system
        types_or: [python, pyi]
        exclude: ^pricing/tools/
        require_serial: true
      - id: pyrefly-check
        name: pyrefly check
        entry: uv run pyrefly check
        language: system
        pass_filenames: false
        types_or: [python, pyi]
