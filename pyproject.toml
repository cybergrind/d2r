[project]
name = 'd2r'
version = '0.1.0'
description = 'Stub project'
authors = [{ name = 'github.com/cybergrind' }]
license = { text = 'Apache-2.0' }
requires-python = '>=3.15'
dependencies = [
  'ipython',
  "pytest>=9.1.1",
  "pycairo>=1.29.1",
  "pygobject>=3.58.0",
  "pydantic>=2.13.5",
  "rich>=15.0.0",
]

# installed with: uv sync
[dependency-groups]
dev = [
    'ruff',
    'pre-commit>=4.5.1',
    'uv>=0.11.6',
    'pyrefly>=0.59',
    "dirty-equals>=0.11",
    "pytest-xdist>=3.8.0",
]

[tool.ruff]
line-length = 120
target-version = 'py315'
indent-width = 4
exclude = ['.venv', '.git']

[tool.ruff.format]
quote-style = 'single'

[tool.ruff.lint.isort]
combine-as-imports = true
known-first-party = ['inventory_tracking']
lines-after-imports = 2

[tool.ruff.lint]
# Preview here, not on the command line, so the pre-commit hook and a plain `ruff check` see the same rules
# (named suppressions such as `# ruff: ignore[lambda-assignment]` are a preview feature).
preview = true
ignore = [
  'print',
  'logging-f-string',
  'bad-quotes-inline-string',
  'bad-quotes-multiline-string',
  'avoidable-escaped-quote',
  'non-empty-init-module',  # packages keep their registries in __init__.py (user, 2026-10-15)
]
fixable = ['ALL']
select = [
  'E',     # pycodestyle
  'F',     # pyflakes
  'I',     # isort
  'B',     # flake8-bugbear
  'UP',    # pyupgrade
  'C4',    # flake8-comprehensions
  'SIM',   # flake8-simplify
  'G',     # flake8-logging-format
  'ASYNC', # flake8-async
  'PIE',   # flake8-pie
  'T20',   # flake8-print
  'PT',    # flake8-pytest-style
  'Q',     # flake8-quotes
  'RUF',
]
exclude = []

[tool.ruff.lint.per-file-ignores]
# Tests compare exact floats on purpose: golden values and constants the code under test returns unchanged.
'tests/**' = ['float-equality-comparison']

[tool.ruff.lint.flake8-quotes]
docstring-quotes = 'double'
inline-quotes = 'single'
multiline-quotes = 'single'

[tool.pytest.ini_options]
testpaths = ['tests']
markers = ['slow: a full arena play (tests/inventory_tracking/scenarios/conftest.py SLOW); skipped by -m "not slow"']

[tool.pyrefly]
# Scope the type checker to the package under active development; pricing waits for its own pass
# (rca/2026-10-19/cleanup/pricing.md, "Pyrefly on pricing").
project-includes = ['inventory_tracking', 'tests']
project-excludes = ['**/__pycache__', '.venv', 'inventory_tracking/runs']
python-version = '3.14'
preset = 'default'
# gi.repository is populated by GObject introspection at import time.
replace-imports-with-any = ['gi.repository']
