[project]
name = 'd2r'
version = '0.1.0'
description = 'Stub project'
authors = [{ name = 'github.com/cybergrind' }]
license = { text = 'Apache-2.0' }
requires-python = '>=3.14'
dependencies = [
  'ipython',
  "pytest>=9.1.1",
  "pycairo>=1.29.1",
  "pygobject>=3.58.0",
  "pydantic>=2.13.5",
]

[project.optional-dependencies]
ocr = [
    "pyocr>=0.8.5",
]

# installed with: uv sync
[dependency-groups]
dev = ['ruff', 'pre-commit>=4.5.1', 'uv>=0.11.6', 'pyrefly>=0.59']

[tool.ruff]
line-length = 120
target-version = 'py314'
indent-width = 4
exclude = ['.venv', '.git']

[tool.ruff.format]
quote-style = 'single'

[tool.ruff.lint.isort]
combine-as-imports = true
known-first-party = ['inventory_tracking']
lines-after-imports = 2

[tool.ruff.lint]
ignore = [
  'T201',  # print
  'G004',  # logging format
  'Q000',  # quotes
  'Q001',  # quotes
  'Q003',  # quotes
]
fixable = ['ALL']
select = [
  'E',     # pycodestyle
  'F',     # pyflakes
  'I',     # isort
  'B',     # flake8-bugbear
  'UP',    # pyupgrade
  'C4',    # flake8-comprehensions
  'SIM',   # flake8-simplify
  'G',     # flake8-logging-format
  'ASYNC', # flake8-async
  'PIE',   # flake8-pie
  'T20',   # flake8-print
  'PT',    # flake8-pytest-style
  'Q',     # flake8-quotes
  'RUF',
]
exclude = []

[tool.ruff.lint.flake8-quotes]
docstring-quotes = 'double'
inline-quotes = 'single'
multiline-quotes = 'single'

[tool.pytest.ini_options]
testpaths = ['tests']

[tool.pyrefly]
# Scope the type checker to the package under active development; pricing/tools are
# standalone scripts with their own import style and an undeclared numpy dependency.
project-includes = ['inventory_tracking', 'tests']
project-excludes = ['**/__pycache__', '.venv', 'inventory_tracking/runs']
python-version = '3.14'
preset = 'default'
# gi.repository is populated by GObject introspection at import time.
replace-imports-with-any = ['gi.repository']
